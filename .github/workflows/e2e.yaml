name: E2E
on:
  workflow_dispatch:
  workflow_call:

  push:
    branches:
      - "main"

  schedule:
    - cron: "0 3 * * *"

  pull_request:
    branches:
      - "main"
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright E2E
    # PRs opt in with the `run-e2e` label.
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-e2e') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IK_IMAGE: infrakitchen:e2e
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docs/examples/docker/Dockerfile
          tags: ${{ env.IK_IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start stack
        working-directory: e2e
        run: |
          ENCRYPTION_KEY=$(python3 -c 'import base64, os; print(base64.urlsafe_b64encode(base64.urlsafe_b64encode(os.urandom(32))).decode())')
          export ENCRYPTION_KEY
          docker compose up -d --wait

      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: e2e
        run: npx playwright test

      - name: Stack logs
        if: failure()
        working-directory: e2e
        run: docker compose logs --tail 300

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

      - name: Stop stack
        if: always()
        working-directory: e2e
        run: docker compose down -v
