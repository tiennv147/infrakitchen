name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (must match the VERSION file)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"

      - name: Validate version
        id: version
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/${{ github.event.repository.default_branch }}" ]]; then
            echo "::error::Run this workflow from the default branch"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION' (expected X.Y.Z or X.Y.Z-rc.N)"
            exit 1
          fi
          file_version=$(tr -d '[:space:]' < VERSION)
          if [[ "$file_version" != "$VERSION" ]]; then
            echo "::error::VERSION file is $file_version; run Prepare Release and merge its PR first"
            exit 1
          fi
          ./scripts/check_version_sync.sh
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-rc.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: CI
    needs: validate
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read
      pull-requests: read

  e2e:
    name: E2E
    needs: validate
    uses: ./.github/workflows/e2e.yaml
    permissions:
      contents: read

  draft:
    name: Create draft release
    needs: [validate, ci, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.validate.outputs.tag }}
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
    steps:
      - name: Create draft release
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --draft --generate-notes --target "$GITHUB_SHA" --title "$TAG")
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease --latest=false)
          fi
          url=$(gh release create "$TAG" "${args[@]}")
          echo "Draft release created: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "Review the notes, then publish it to build the image and npm package." >> "$GITHUB_STEP_SUMMARY"
