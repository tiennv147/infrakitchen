name: Publish npm snapshot (rc) manually

# Stable versions are published by publish.yaml when a GitHub release is published.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish-to-npm:
    if: ${{ github.repository_owner == 'electrolux-oss' }}
    runs-on: ubuntu-latest

    steps:
      #############################################################################
      # common steps
      #############################################################################
      - uses: actions/checkout@v7.0.0

      - name: use node.js 24.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.x"
          registry-url: https://registry.npmjs.org/ # Needed for auth

      - name: Run ESLint
        run: ./scripts/check_typescript.sh

      #############################################################################
      # publish a library to npm
      #############################################################################
      - name: Setup snapshot version
        working-directory: ./ui/frontend-lib
        run: |
          VERSION=$(npm pkg get version --workspaces=false | tr -d \")
          npm pkg set version="$VERSION-$(date +%F%T | tr -d '\-:')-${GITHUB_SHA::7}"

      #############################################################################
      # publish a release to npm
      #############################################################################
      - name: publish package
        working-directory: ./ui/frontend-lib
        run: |
          yarn install --immutable
          yarn build
          yarn config set -H 'npmAuthToken' "${{secrets.NPM_TOKEN}}"

          yarn npm publish --access public --tolerate-republish --tag rc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
